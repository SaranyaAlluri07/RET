name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx

    - name: Run Core Test Suite
      run: |
        python -m pytest tests/test_alarms.py tests/test_care.py tests/test_quality.py tests/test_scenarios.py tests/test_replay.py -v

    - name: Run API & Integration Test Suite
      run: |
        python -m pytest tests/test_api.py -v

    - name: Run Model Isolation & Determinism Test Suite
      run: |
        python -m pytest tests/test_isolation_and_determinism.py -v
